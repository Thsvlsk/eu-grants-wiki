<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 438">
  <text x="170" y="44">One person, one calendar year,</text>
  <text x="170" y="64">all EU grants together</text>
  <rect class="box hl" x="10" y="76" width="320" height="46" rx="12"/>
  <text x="170" y="106">EU grant A</text>
  <text class="op" x="170" y="154">+</text>
  <rect class="box hl" x="10" y="166" width="320" height="46" rx="12"/>
  <text x="170" y="196">EU grant B</text>
  <text class="op" x="170" y="244">+</text>
  <rect class="box hl" x="10" y="256" width="320" height="46" rx="12"/>
  <text x="170" y="286">EU grant C</text>
  <text class="op" x="170" y="334">≤</text>
  <rect class="box" x="10" y="346" width="320" height="82" rx="12"/>
  <text x="170" y="376">215 per calendar year</text>
  <text class="sub" x="170" y="398">or 215 × working time factor</text>
  <text class="sub" x="170" y="416">for part-time staff (AGA v2.0, p. 53)</text>
</svg>
