<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150">
  <rect class="box" x="10" y="12" width="170" height="116" rx="12"/>
  <text x="95" y="46">215 ÷ 12</text>
  <text class="sub" x="95" y="70">215 a year, split</text>
  <text class="sub" x="95" y="88">into 12 months</text>
  <text class="sub" x="95" y="110">(about 17.92 a month)</text>
  <text class="op" x="192" y="80">×</text>
  <rect class="box" x="204" y="12" width="150" height="116" rx="12"/>
  <text x="279" y="52">Number of months</text>
  <text class="sub" x="279" y="76">employed within the</text>
  <text class="sub" x="279" y="94">reporting period</text>
  <text class="op" x="366" y="80">×</text>
  <rect class="box" x="378" y="12" width="170" height="116" rx="12"/>
  <text x="463" y="52">Working time factor</text>
  <text class="sub" x="463" y="76">e.g. 1 for full-time,</text>
  <text class="sub" x="463" y="94">0.5 for 50% part-time</text>
  <text class="op" x="560" y="80">=</text>
  <rect class="box hl" x="572" y="12" width="178" height="116" rx="12"/>
  <text x="661" y="42">Maximum declarable</text>
  <text x="661" y="62">day-equivalents</text>
  <text class="sub" x="661" y="90">rounded to the nearest</text>
  <text class="sub" x="661" y="108">half day-equivalent</text>
</svg>
