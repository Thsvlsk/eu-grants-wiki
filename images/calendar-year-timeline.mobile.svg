<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 290">
  <text x="170" y="26">Normally: one calculation</text>
  <text x="170" y="48">for the whole reporting period</text>
  <rect class="box hl" x="10" y="62" width="320" height="50" rx="10"/>
  <line class="dash" x1="170" y1="58" x2="170" y2="190"/>
  <text x="90" y="93">Year 1</text>
  <text x="250" y="93">Year 2</text>
  <text x="170" y="150">Alternatively: one calculation</text>
  <text x="170" y="172">per calendar year</text>
  <rect class="box" x="10" y="196" width="150" height="80" rx="10"/>
  <rect class="box" x="180" y="196" width="150" height="80" rx="10"/>
  <text class="sub" x="85" y="226">months of year 1</text>
  <text class="sub" x="85" y="246">within the period</text>
  <text class="sub" x="255" y="226">months of year 2</text>
  <text class="sub" x="255" y="246">within the period</text>
</svg>
